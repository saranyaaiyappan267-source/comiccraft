<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ComicCraft</title><style>body{background:#0f172a;color:white;font-family:Arial;text-align:center;padding:20px}h1{color:#facc15}input{width:320px;padding:12px;border-radius:8px;border:none}button{background:#facc15;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-left:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:800px;margin:20px auto}.panel{background:white;color:black;border-radius:10px;overflow:hidden}.panel img{width:100%;height:200px;object-fit:cover;background:#ddd}.panel p{padding:8px;font-size:12px;font-weight:bold}</style></head><body><h1>💥 ComicCraft - AI Comic</h1><p>Naan Mudhalvan - Team Lead: Vanitha</p><br><input id="story" value="A CAT SUPERHERO SAVING CITY"><button onclick="make()">Create Comic</button><div class="grid" id="grid"></div><script>function make(){let s=document.getElementById('story').value;let g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<4;i++){let d=document.createElement('div');d.className='panel';d.innerHTML=`<img id="im${i}" src="https://via.placeholder.com/400x200?text=Loading..."><p>Panel ${i+1}: ${s}</p>`;g.appendChild(d);let img=document.getElementById(`im${i}`);setTimeout(()=>{img.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(s+' comic panel '+(i+1))}?seed=${Date.now()+i*500}&width=600&height=300&nologo=true`;},i*1200);}}</script></body></html>
